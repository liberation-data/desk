# Builds the website (website/) and publishes it to GitHub Pages, under /desk/ on the Liberation Data site. A pull
# request that touches the site builds it without publishing it.
name: Website

on:
    push:
        branches: [main]
        paths: ['website/**', 'docs/screenshots/**', '.github/workflows/website.yml']
    pull_request:
        paths: ['website/**', 'docs/screenshots/**', '.github/workflows/website.yml']
    workflow_dispatch:

permissions:
    contents: read

# One publish at a time, never cut short; a pull request's build is cut short by its next push.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('website-{0}', github.ref) || 'pages' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
              working-directory: website
            - run: npm run build
              working-directory: website
            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: website/dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
