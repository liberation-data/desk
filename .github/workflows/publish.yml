# Releases @liberation-data/desk to npm. See RELEASING.md.
#
# Every merge to main that changes what the package ships starts a release, which waits for approval in the `release`
# environment. Approving it releases what main holds at that moment — everything merged since the last release, as
# one version: the last release bumped by the biggest change merged (scripts/release-plan.sh). The job checks, packs
# and publishes that commit with provenance, then commits the version to main, tags it, and creates the GitHub
# release. A pull request that touches the release machinery, and a manual run, are dry runs.
#
# It publishes with npm trusted publishing: npm is told, in the package's settings, that this repository's publish.yml
# may publish it from the `release` environment, and GitHub proves that on each run. That is why the file keeps this
# name.
name: Release

on:
  push:
    branches: [main]
    # What the package ships, and what builds it. A merge that changes none of these releases nothing.
    paths:
      - src/**
      - README.md
      - LICENSE
      - NOTICE
      - llms.txt
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - scripts/css.mjs
  # A dry run, unless `publish` is ticked on main: then it releases what main holds, as a merge would. For a merge
  # that didn't start a release, or one whose release was rejected and is wanted after all.
  workflow_dispatch:
    inputs:
      publish:
        description: Release what main holds (on main only). Unticked, a dry run.
        type: boolean
        default: false
  # A dry run, so a change to the release machinery is tested on its pull request.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - RELEASING.md
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - scripts/css.mjs
      - scripts/release-version.mjs
      - scripts/release-plan.sh
      - scripts/release-pack.sh

permissions:
  contents: read

jobs:
  # What this run's commit would release, said in the run's summary. The release itself plans again once approved,
  # from main as it is then.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
        run: |
          scripts/release-plan.sh HEAD > plan.txt
          version=$(sed -n 's/^version=//p' plan.txt)
          publish=false
          if [[ "$WANTED" == true && -n "$version" ]]; then
            publish=true
          elif [[ "$WANTED" == true ]]; then
            echo "::notice::Nothing merged since $(sed -n 's/^last=//p' plan.txt) changes what the package ships, so this releases nothing."
          fi
          # With nothing to release, a dry run still packs, as the next patch would be.
          [[ -n "$version" ]] || version=$(node scripts/release-version.mjs bump "$(sed -n 's/^base=//p' plan.txt)" patch)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          { echo "### Release plan"; echo; sed 's/^/    /' plan.txt; echo; echo "Publish: $publish"; } >> "$GITHUB_STEP_SUMMARY"

  # The full CI, as it runs on main and on pull requests.
  gate:
    needs: check
    uses: ./.github/workflows/ci.yml

  # A dry run of the release, on this run's commit: pack, check, install alone, and `npm publish --dry-run`.
  build:
    needs: [check, gate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The npm that publishes. Pinned, as npm's latest can be a new major; trusted publishing needs 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: scripts/release-pack.sh "$VERSION"
      # npm refuses even a dry run of a version it has, so a dry run planned for one tries a throwaway prerelease.
      - name: Dry run of npm publish
        run: |
          tarball="./package/$(jq -r '.[0].filename' package/pack.json)"
          if npm view "@liberation-data/desk@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            mkdir "$RUNNER_TEMP/dry-run"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/dry-run"
            (cd "$RUNNER_TEMP/dry-run/package" && npm pkg set version="$VERSION-dryrun.$GITHUB_RUN_ID")
            npm publish "$RUNNER_TEMP/dry-run/package" --ignore-scripts --dry-run --access public --tag dry-run
          else
            npm publish "$tarball" --dry-run --access public
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/
          if-no-files-found: error

  # The human checkpoint, and the release. One runs at a time and none is cancelled: GitHub keeps one more waiting
  # behind it, a newer merge replacing that one. Approved, it releases main as it is then; a run approved after
  # another has released everything finds nothing new, and does nothing.
  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g npm@11.21.1
      - name: Plan the release, from main as it is now
        id: plan
        run: |
          # A step's default shell has no pipefail, so without it tee would hide the plan failing.
          set -o pipefail
          # The plan goes on without npm when it can't reach it. A release can't: npm's latest may be ahead of the tags.
          npm view @liberation-data/desk dist-tags.latest > /dev/null
          scripts/release-plan.sh HEAD | tee plan.txt
          last=$(sed -n 's/^last=//p' plan.txt)
          base=$(sed -n 's/^base=//p' plan.txt)
          # npm ahead of the tags is a release that published and was never recorded. Releasing on top of it would
          # leave a version with no tag, so it stops for a person to tag that release first.
          if [[ "$base" != "${last#v}" ]]; then
            echo "::error::npm's latest is $base, but the newest tag is ${last:-none}: a release published without being recorded. Tag the commit it was built from v$base, merge that tag into main, then run Release from main with publish ticked."
            exit 1
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version=//p' plan.txt)
          [[ -n "$version" ]] || echo "::notice::Nothing new to release since $last: an earlier approval released it."
      - if: steps.plan.outputs.version != ''
        run: npm ci && npm run check
      - if: steps.plan.outputs.version != ''
        run: scripts/release-pack.sh "${{ steps.plan.outputs.version }}"
      # Trusted publishing is used when it's configured on npmjs.com. An NPM_TOKEN secret, if set, is the fallback.
      - name: Publish to npm
        if: steps.plan.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken '${NODE_AUTH_TOKEN}'
          fi
          npm publish "./package/$(jq -r '.[0].filename' package/pack.json)" --provenance --access public
      # The release commit sits on the commit that was published, changing only the version, and carries the tag. Main
      # takes it by a merge, a fast-forward unless more was merged meanwhile. A push made with this token starts no
      # workflow, so it doesn't release again.
      - name: Commit the version to main and tag it
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="v$VERSION"
          git checkout -- .
          # Main's package.json may hold the version already, from a bump merged by hand.
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          git commit --allow-empty -am "Release $tag"
          git tag "$tag"
          git push origin "$tag"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch -C main origin/main
            if git merge --no-edit -m "Release $tag" "$tag" && git push origin main; then exit 0; fi
            git merge --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Published and tagged $tag, but couldn't merge it into main. Merge it by hand, with this message so the next release skips it: git merge -m 'Release $tag' $tag"
          exit 1
      - name: Create the GitHub release
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes ${LAST:+--notes-start-tag "$LAST"}
